<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - المنصة التعليمية</title>
  <!-- ربط ملف الـ CSS من المجلد بتاعه -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <h2>مرحبًا بك في المنصة التعليمية</h2>
    <p>اختر نوع الحساب للدخول:</p>

    <!-- أزرار تحديد الصفة -->
    <div class="role-selector">
        
      <button type="button" class="role-btn active" onclick="selectRole('student')">👨‍🎓 طالب</button>
      <button type="button" class="role-btn" onclick="selectRole('parent')">👨‍👩‍👦 ولي أمر</button>
      
    </div>

    <!-- نموذج تسجيل دخول الطالب -->
    <form id="student-form" class="auth-form" action="index.html" method="GET">
      <h3>دخول الطالب</h3>
      <div class="form-group">
        <label for="student-id">كود الطالب:</label>
        <input type="text" id="student-id" placeholder="أدخل كود الطالب" required>
      </div>
      <div class="form-group">
        <label for="student-pass">كلمة المرور:</label>
        <input type="password" id="student-pass" placeholder="أدخل كلمة المرور" required>
      </div>
      <div class="form-group-options">
  <label>
    <input type="checkbox" name="remember"> تذكرني
  </label>
  <a href="#" class="forgot-pass">نسيت كلمة المرور؟</a>
</div>
      <button type="submit" class="submit-btn">دخول الطالب</button>
    </form>

    <!-- نموذج تسجيل دخول ولي الأمر -->
    <form id="parent-form" class="auth-form hidden" action="Parent-dash.html" method="GET">
      <h3>دخول ولي الأمر</h3>
      <div class="form-group">
        <label for="parent-phone">رقم الهاتف / البريد:</label>
        <input type="text" id="parent-phone" placeholder="أدخل رقم الهاتف" required>
      </div>
      <div class="form-group">
        <label for="child-id">كود الطالب (ابنك):</label>
        <input type="text" id="child-id" placeholder="أدخل كود الطالب لمتابعته" required>
      </div>
      <div class="form-group">
        <label for="parent-pass">كلمة المرور:</label>
        <input type="password" id="parent-pass" placeholder="أدخل كلمة المرور" required>
      </div>
      <div class="form-group-options">
  <label>
    <input type="checkbox" name="remember"> تذكرني
  </label>
  <a href="#" class="forgot-pass">نسيت كلمة المرور؟</a>
</div>
      <button type="submit" class="submit-btn">متابعة الطالب</button>
      
    </form>
  </div>

  <!-- ربط ملف الـ JavaScript من المجلد بتاعه -->
  <script src="login.js"></script>
</body>
</html>
