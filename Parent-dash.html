<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة متابعة ولي الأمر</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="dashboard-container">
    <header class="dashboard-header">
      <h2>👋 مرحبًا بك في لوحة المتابعة</h2>
      <p>متابعة تقرير الطالب: <strong id="student-name">...</strong> (الكود: <span id="student-code">...</span>)</p>
      <a href="login.html" class="logout-btn">تسجيل الخروج</a>
    </header>

    <div class="stats-cards">
      <div class="card green">
        <h3>📚 الكتب المكتملة</h3>
        <p class="stat-number" id="stat-books">-</p>
      </div>
      <div class="card blue">
        <h3>⏱️ ساعات المذاكرة</h3>
        <p class="stat-number" id="stat-hours">-</p>
      </div>
      <div class="card orange">
        <h3>📝 التقييم العام</h3>
        <p class="stat-number" id="stat-score">-</p>
      </div>
    </div>
  </div>
  <script src="Parent-dash.js"></script>
</body>
</html>
