<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* خلفية متحركة */
        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, #1b0035, transparent 35%),
                radial-gradient(circle at 80% 70%, #001d3d, transparent 35%),
                #050505;
            animation: backgroundMove 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundMove {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.15);
            }
        }

        /* خطوط الإضاءة */
        .line {
            position: fixed;
            width: 2px;
            height: 140%;
            background: linear-gradient(
                transparent,
                rgba(0, 200, 255, .7),
                transparent
            );
            transform: rotate(25deg);
            animation: moveLine 5s linear infinite;
            opacity: .25;
        }

        .line:nth-child(2) {
            left: 30%;
            animation-delay: 1.5s;
        }

        .line:nth-child(3) {
            left: 70%;
            animation-delay: 3s;
        }

        @keyframes moveLine {
            from {
                top: -150%;
            }
            to {
                top: 150%;
            }
        }

        /* شاشة البداية */
        .intro {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: introOut 2s ease forwards;
            animation-delay: 2.5s;
        }

        .intro h1 {
            font-size: clamp(35px, 8vw, 80px);
            letter-spacing: 8px;
            opacity: 0;
            animation: titleIn 1.5s ease forwards;
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: scale(1.5);
                filter: blur(20px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes introOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* صندوق الدخول */
        .login-box {
            position: relative;
            width: min(90%, 420px);
            padding: 45px 35px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 25px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 50px rgba(0,150,255,.15),
                inset 0 0 30px rgba(255,255,255,.03);

            opacity: 0;
            transform: translateY(80px) scale(.9);
            animation: boxIn 1.2s cubic-bezier(.16,1,.3,1) forwards;
            animation-delay: 2.8s;
        }

        @keyframes boxIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-box h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }

        /* الحقول */
        .input-box {
            position: relative;
            margin-bottom: 25px;
            opacity: 0;
            transform: translateX(40px);
        }

        .input-box:nth-of-type(1) {
            animation: inputIn .8s ease forwards;
            animation-delay: 3.5s;
        }

        .input-box:nth-of-type(2) {
            animation: inputIn .8s ease forwards;
            animation-delay: 3.8s;
        }

        @keyframes inputIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .input-box input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(0,0,0,.35);
            border: 1px solid #333;
            border-radius: 12px;
            outline: none;
            color: white;
            font-size: 16px;
            transition: .3s;
        }

        .input-box input:focus {
            border-color: #00aaff;
            box-shadow: 0 0 20px rgba(0,170,255,.25);
            transform: translateY(-2px);
        }

        .input-box label {
            position: absolute;
            right: 18px;
            top: 16px;
            color: #888;
            pointer-events: none;
            transition: .3s;
            background: #111;
            padding: 0 5px;
        }

        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label {
            top: -9px;
            font-size: 12px;
            color: #00aaff;
        }

        /* الزر */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #0077ff, #00c6ff);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;

            opacity: 0;
            animation: buttonIn .8s ease forwards;
            animation-delay: 4.2s;

            transition: .3s;
        }

        @keyframes buttonIn {
            to {
                opacity: 1;
            }
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(0,170,255,.35);
        }

        button:active {
            transform: scale(.96);
        }

        /* نقطة ضوء */
        .glow {
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #0077ff;
            filter: blur(120px);
            opacity: .12;
            pointer-events: none;
            animation: glowMove 10s infinite alternate;
        }

        @keyframes glowMove {
            from {
                transform: translate(-30vw, -20vh);
            }
            to {
                transform: translate(30vw, 20vh);
            }
        }

    </style>
</head>

<body>

    <div class="background"></div>

    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>

    <div class="glow"></div>

    <!-- شاشة البداية -->
    <div class="intro">
        <h1>WELCOME</h1>
    </div>

    <!-- تسجيل الدخول -->
    <div class="login-box">

        <h2>مرحباً بك</h2>

        <p class="subtitle">
            سجل دخولك للمتابعة
        </p>

        <div class="input-box">
            <input type="text" id="username" placeholder=" ">
            <label>اسم المستخدم</label>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder=" ">
            <label>كلمة المرور</label>
        </div>

        <button onclick="login()">
            دخول
        </button>

    </div>

    <script>

        function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            if (username === "" || password === "") {

                alert("من فضلك اكتب اسم المستخدم وكلمة المرور");

                return;
            }

            // تأثير بسيط عند تسجيل الدخول
            document.body.style.transition = "1s";
            document.body.style.opacity = "0";

            setTimeout(() => {

                alert("تم تسجيل الدخول باسم: " + username);

                document.body.style.opacity = "1";

            }, 1000);
        }

    </script>

</body>
</html>
